# Local / on-premises stack: PostgreSQL + backend (+ frontend from the sibling repository).
# Usage (both repos cloned side by side):  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rhob
      POSTGRES_USER: rhob
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rhob-local-only}
    volumes: [rhob_pg:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U rhob"], interval: 5s, retries: 10}
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://rhob:${POSTGRES_PASSWORD:-rhob-local-only}@db:5432/rhob
      RHOB_TOKEN_SECRET: ${RHOB_TOKEN_SECRET:-local-dev-secret-change-me}
      PORT: "8000"
    command: ["sh", "./start.sh"]
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  frontend:
    build: ../rhob-frontend
    environment:
      API_BASE_URL: http://backend:8000
      PORT: "8501"
    ports: ["8501:8501"]
    depends_on: [backend]
volumes:
  rhob_pg: {}
